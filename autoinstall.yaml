#cloud-config 
autoinstall:
    version: 1
    identity:
        realname: 'IPOG'
        hostname: ubuntu-ipog
        username: ipog
        password: "$6$rounds=4096$example_salt$example_hashed_password"
    user-data:
        package_upgrade: true
        users:
            - name: Aluno
              gecos: Aluno
              groups: []
              shell: /bin/bash
              lock_password: true
              sudo: ['ALL=(ALL) NOPASSWD:ALL']
    locale: pt_BR.utf8
    keyboard:
        layout: br
    timezone: "America/Sao_Paulo"   
    packages:
        - libreoffice
        - git
        - wget
        - curl
        - build-essential
        - net-tools
        - vim
        - unzip
        - ubuntu-restricted-extras
        - ubuntu-drivers-common
    updates: all
    shutdown:
        reboot: true